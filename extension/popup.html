<!doctype html>
<html lang="th" data-udth-own-page>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ฮองเรียน</title>
    <style>
      /* ======================================================================
         ฮองเรียน Popup — Cinema Aurora Glassmorphism Design System
         Three-layer tokens (Primitive -> Semantic -> Component) matching
         the in-player menu (overlay.css).
         ====================================================================== */
      :root {
        color-scheme: dark;
        /* Primitive */
        --ink-950: #06080f;
        --ink-900: #0b0e18;
        --ink-850: #111626;
        --ink-800: #181f34;
        --gray-50: #f8fafc;
        --gray-100: #f1f5f9;
        --gray-300: #cbd5e1;
        --gray-400: #94a3b8;
        --teal-300: #5eead4;
        --teal-400: #2dd4bf;
        --teal-700: #0f766e;
        --teal-950: #042f2b;
        --violet-300: #c4b5fd;
        --violet-400: #a78bfa;
        --violet-500: #8b5cf6;
        --cyan-300: #67e8f9;
        --cyan-400: #38bdf8;
        --amber-300: #fcd34d;
        --amber-400: #fbbf24;
        --green-400: #34d399;
        --rose-400: #fb7185;

        /* Semantic (Cinema Aurora Dark) */
        --bg: var(--ink-950);
        --surface: rgba(15, 20, 35, 0.78);
        --surface-2: rgba(255, 255, 255, 0.055);
        --surface-hover: rgba(255, 255, 255, 0.085);
        --field: rgba(11, 14, 24, 0.92);
        --line: rgba(255, 255, 255, 0.085);
        --line-strong: rgba(255, 255, 255, 0.17);
        --specular: inset 0 1px 0 rgba(255, 255, 255, 0.11);
        --text: var(--gray-50);
        --text-2: var(--gray-300);
        --text-3: var(--gray-400);
        --accent: var(--teal-400);
        --accent-hover: var(--teal-300);
        --on-accent: var(--teal-950);
        --accent-text: var(--teal-300);
        --accent-soft: rgba(45, 212, 191, 0.15);
        --aurora-grad: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 52%, #8b5cf6 100%);
        --logo-grad: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 50%, #a78bfa 100%);
        --ok: var(--green-400);
        --ok-soft: rgba(52, 211, 153, 0.13);
        --err: var(--rose-400);
        --err-soft: rgba(251, 113, 133, 0.14);
        --track: rgba(255, 255, 255, 0.14);
        --focus: var(--teal-300);
        --r-sm: 9px;
        --r-md: 12px;
        --r-lg: 16px;
        --font:
          "Noto Sans Thai", "IBM Plex Sans Thai", "Leelawadee UI",
          "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        width: 372px;
        margin: 0;
        padding: 0 0 14px;
        background:
          radial-gradient(130% 140px at 12% 0%, rgba(139, 92, 246, 0.24), transparent 68%),
          radial-gradient(110% 120px at 88% 0%, rgba(45, 212, 191, 0.18), transparent 65%),
          radial-gradient(90% 140px at 50% 100%, rgba(56, 189, 248, 0.08), transparent 70%),
          var(--bg);
        color: var(--text);
        font: 400 13.5px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }

      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      svg {
        flex: none;
      }

      /* ---- Header ---- */
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 10px;
        padding: 13px 13px 11px;
        border-bottom: 1px solid var(--line);
        background: rgba(6, 8, 15, 0.76);
        backdrop-filter: blur(18px) saturate(170%);
        -webkit-backdrop-filter: blur(18px) saturate(170%);
      }

      .logo {
        display: grid;
        place-items: center;
        flex: none;
        width: 35px;
        height: 35px;
        border-radius: 10px;
        background: var(--logo-grad);
        box-shadow:
          0 6px 18px rgba(45, 212, 191, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        color: var(--ink-950);
        font-size: 19px;
        font-weight: 800;
        line-height: 1;
      }

      .brand {
        flex: 1;
        min-width: 0;
        line-height: 1.28;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .brand h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .brand p {
        margin: 2px 0 0;
        color: var(--text-3);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hw-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1.5px 7px;
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.34);
        background: rgba(56, 189, 248, 0.12);
        color: var(--cyan-300);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }

      .hw-badge[hidden] {
        display: none !important;
      }

      .hw-badge::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 6px currentColor;
      }

      .hw-badge[data-mode="a100"] {
        border-color: rgba(251, 191, 36, 0.45);
        background: linear-gradient(135deg, rgba(251, 191, 36, 0.22), rgba(139, 92, 246, 0.18));
        color: var(--amber-300);
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.18);
      }

      .version {
        color: var(--text-3);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }

      .lang {
        flex: none;
        padding: 2px;
        border-radius: var(--r-sm);
      }

      .lang .seg-btn {
        min-height: 28px;
        min-width: 36px;
        padding: 0 7px;
        font-size: 12px;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0 12px;
      }

      /* ---- Server / Lecture Status Banner ---- */
      .status {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 13px;
        border: 1px solid rgba(251, 113, 133, 0.26);
        border-radius: var(--r-md);
        background:
          radial-gradient(100% 120% at 0% 0%, rgba(251, 113, 133, 0.18), transparent 65%),
          var(--err-soft);
        box-shadow: var(--specular);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.5;
      }

      .status::before {
        content: "";
        flex: none;
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--err);
        box-shadow:
          0 0 0 3px rgba(251, 113, 133, 0.22),
          0 0 10px var(--err);
      }

      .status.ok {
        border-color: rgba(52, 211, 153, 0.26);
        background:
          radial-gradient(100% 120% at 0% 0%, rgba(52, 211, 153, 0.16), transparent 65%),
          var(--ok-soft);
      }

      .status.ok::before {
        background: var(--ok);
        box-shadow:
          0 0 0 3px rgba(52, 211, 153, 0.22),
          0 0 10px var(--ok);
      }

      /* ---- Settings List Card ---- */
      .list {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%),
          var(--surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 12px 28px -8px rgba(0, 0, 0, 0.45),
          var(--specular);
      }

      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 10px 14px;
        cursor: pointer;
        transition: background 150ms ease;
      }

      .row + .row {
        border-top: 1px solid var(--line);
      }

      .row:hover {
        background: var(--surface-hover);
      }

      .row:has(#active:checked),
      .row:has(#dubbing:checked) {
        background:
          radial-gradient(120% 120% at 0% 0%, rgba(45, 212, 191, 0.14), rgba(139, 92, 246, 0.08) 70%, transparent 100%);
      }

      .row input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .row:has(input:focus-visible) {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
        border-radius: var(--r-lg);
      }

      .row:has(input:disabled) {
        opacity: 0.48;
      }

      .ico {
        display: grid;
        place-items: center;
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        background: var(--surface-2);
        color: var(--text-3);
        transition:
          background 150ms ease,
          color 150ms ease,
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      .row:has(input:checked) .ico {
        border-color: rgba(45, 212, 191, 0.35);
        background: linear-gradient(135deg, rgba(45, 212, 191, 0.22), rgba(139, 92, 246, 0.18));
        color: var(--accent-text);
        box-shadow: 0 0 14px rgba(45, 212, 191, 0.18);
      }

      .txt {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        line-height: 1.35;
      }

      .txt b {
        font-size: 13.5px;
        font-weight: 600;
      }

      .txt small {
        color: var(--text-3);
        font-size: 11.5px;
      }

      /* Live Equalizer Waveform when Dubbing is Active */
      .wave {
        display: none;
        align-items: flex-end;
        gap: 2px;
        height: 14px;
        padding: 0 2px;
      }

      .row:has(#dubbing:checked) .wave {
        display: inline-flex;
      }

      .wave i {
        display: block;
        width: 2.5px;
        height: 4px;
        border-radius: 99px;
        background: linear-gradient(180deg, var(--teal-300), var(--violet-400));
        animation: wave-bar 1.1s ease-in-out infinite;
      }

      .wave i:nth-child(1) { animation-delay: 0s; height: 6px; }
      .wave i:nth-child(2) { animation-delay: 0.18s; height: 12px; }
      .wave i:nth-child(3) { animation-delay: 0.34s; height: 8px; }
      .wave i:nth-child(4) { animation-delay: 0.50s; height: 10px; }

      @keyframes wave-bar {
        0%, 100% { transform: scaleY(0.45); opacity: 0.7; }
        50% { transform: scaleY(1.1); opacity: 1; }
      }

      .switch {
        position: relative;
        flex: none;
        width: 40px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--track);
        transition: background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        transition: transform 200ms var(--spring);
      }

      .row:has(input:checked) .switch {
        border-color: transparent;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(45, 212, 191, 0.35);
      }

      .row:has(input:checked) .switch::after {
        transform: translateX(18px);
      }

      /* ---- Voice & Audio Studio Card ---- */
      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%),
          var(--surface);
        box-shadow:
          0 12px 28px -8px rgba(0, 0, 0, 0.45),
          var(--specular);
      }

      .card[hidden] {
        display: none;
      }

      .card-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: var(--text-2);
        font-size: 12.5px;
        font-weight: 700;
      }

      .card-title svg {
        color: var(--accent);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .field label,
      .field-label {
        color: var(--text-2);
        font-size: 12px;
        font-weight: 600;
      }

      .field[hidden] {
        display: none;
      }

      .tier-badge {
        display: inline-flex;
        align-items: center;
        padding: 1.5px 7px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-2);
        font-style: normal;
        font-size: 10.5px;
        font-weight: 700;
      }

      .tier-badge[data-tier="a100"] {
        border-color: rgba(251, 191, 36, 0.45);
        background: linear-gradient(135deg, rgba(251, 191, 36, 0.22), rgba(139, 92, 246, 0.18));
        color: var(--amber-300);
      }

      .tier-badge[data-tier="gpu"] {
        border-color: rgba(167, 139, 250, 0.42);
        background: rgba(139, 92, 246, 0.18);
        color: var(--violet-300);
      }

      .tier-badge[data-tier="cloud"] {
        border-color: rgba(56, 189, 248, 0.38);
        background: rgba(56, 189, 248, 0.14);
        color: var(--cyan-300);
      }

      .seg {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 3px;
        padding: 3px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: var(--r-md);
        background: rgba(6, 8, 15, 0.58);
      }

      .seg-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text-2);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 150ms var(--ease),
          color 150ms ease,
          box-shadow 150ms ease,
          transform 100ms ease;
      }

      .seg-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }

      .seg-btn:active {
        transform: scale(0.97);
      }

      .seg-btn[aria-pressed="true"] {
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 700;
        box-shadow:
          0 2px 10px rgba(45, 212, 191, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .field-hint {
        color: var(--text-3);
        font-size: 11.5px;
        line-height: 1.5;
      }

      output {
        color: var(--accent-text);
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      select {
        width: 100%;
        min-width: 0;
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: var(--field);
        color: var(--text);
        font-size: 12.5px;
        cursor: pointer;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      select:hover {
        border-color: rgba(45, 212, 191, 0.45);
      }

      select option {
        background: var(--ink-900);
        color: var(--text);
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        margin: 4px 0;
        border-radius: 999px;
        background:
          linear-gradient(90deg, var(--teal-400) 0%, var(--violet-400) var(--val, 50%), rgba(255, 255, 255, 0.14) var(--val, 50%));
        accent-color: var(--accent);
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid var(--ink-950);
        background: #ffffff;
        box-shadow: 0 0 10px rgba(45, 212, 191, 0.55), 0 1px 3px rgba(0, 0, 0, 0.5);
        transition: transform 120ms ease;
      }

      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      /* ---- Actions ---- */
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          transform 100ms ease,
          box-shadow 150ms ease;
      }

      .btn:hover:not(:disabled) {
        background: var(--surface-hover);
        border-color: rgba(255, 255, 255, 0.26);
      }

      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .btn-primary {
        border-color: transparent;
        background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 55%, #0ea5e9 100%);
        color: var(--on-accent);
        font-weight: 700;
        box-shadow:
          0 4px 16px rgba(45, 212, 191, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #5eead4 0%, #2dd4bf 55%, #38bdf8 100%);
        border-color: transparent;
        box-shadow:
          0 6px 20px rgba(45, 212, 191, 0.36),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }

      /* ---- Section Pre-Translation Progress ---- */
      .queue {
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        background:
          radial-gradient(120% 90px at 0% 0%, rgba(45, 212, 191, 0.14), rgba(139, 92, 246, 0.10) 60%, transparent 100%),
          var(--surface);
        box-shadow: var(--specular);
      }

      .queue-title {
        font-size: 13px;
        font-weight: 700;
      }

      .queue-detail {
        margin-top: 2px;
        overflow: hidden;
        color: var(--text-3);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .queue-track {
        height: 6px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--track);
      }

      .queue-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: var(--aurora-grad);
        box-shadow: 0 0 10px rgba(45, 212, 191, 0.4);
        transition: width 220ms ease-out;
      }

      .hint {
        margin: 2px 8px 0;
        color: var(--text-3);
        font-size: 12px;
        line-height: 1.55;
        text-align: center;
      }

      code {
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface-2);
        color: var(--accent-text);
        font: 11.5px Consolas, "Cascadia Mono", monospace;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="logo" aria-hidden="true">ท</div>
      <div class="brand">
        <div class="brand-row">
          <h1 data-i18n>ฮองเรียน</h1>
          <span id="hwBadge" class="hw-badge" hidden></span>
        </div>
        <p data-i18n>ซับไทย + เสียงพากย์ · Udemy / YouTube</p>
      </div>
      <!-- Each language is named in itself, so either reader can find theirs. -->
      <div class="seg lang" role="group" aria-label="ภาษาของหน้าจอ" data-i18n-aria>
        <button type="button" class="seg-btn" data-lang="th" lang="th">ไทย</button>
        <button type="button" class="seg-btn" data-lang="en" lang="en">EN</button>
      </div>
      <span class="version">v</span>
    </header>

    <main>
      <div id="status" class="status" role="status" aria-live="polite" data-i18n>กำลังตรวจสอบ ...</div>

      <div class="list" role="group" aria-label="การแสดงผล" data-i18n-aria>
        <label class="row">
          <input type="checkbox" id="active" />
          <span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></span>
          <span class="txt"><b data-i18n>ทำงานอัตโนมัติ</b><small id="activeHint" data-i18n>แปลซับและบทเรียนเมื่อเปิดหน้า</small></span>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="row">
          <input type="checkbox" id="enabled" checked />
          <span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg></span>
          <span class="txt"><b data-i18n>ซับไทย</b><small data-i18n>แสดงคำแปลทับบนวิดีโอ</small></span>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="row">
          <input type="checkbox" id="dual" checked />
          <span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg></span>
          <span class="txt"><b data-i18n>ต้นฉบับกำกับ</b><small data-i18n>ต้นฉบับบรรทัดเล็กใต้ซับไทย</small></span>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="row">
          <input type="checkbox" id="dubbing" />
          <span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></span>
          <span class="txt"><b data-i18n>พากย์เสียงไทย</b><small data-i18n>อ่านซับไทยออกเสียงตามจังหวะ</small></span>
          <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>

      <section class="card" id="audioSettings" aria-labelledby="audio-title" hidden>
        <h2 class="card-title" id="audio-title"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span data-i18n>ตั้งค่าเสียงพากย์</span></h2>
        <div class="field">
          <div class="field-head">
            <label for="ttsEngine" data-i18n>เครื่องมือเสียง</label>
            <em id="engineTier" class="tier-badge"></em>
          </div>
          <select id="ttsEngine"></select>
        </div>
        <div class="field"><label for="voice" data-i18n>เสียง</label><select id="voice"></select></div>
        <div class="field" id="startField" hidden>
          <span class="field-label" id="start-label" data-i18n>เริ่มเล่นเมื่อไหร่</span>
          <div class="seg" role="group" aria-labelledby="start-label">
            <button type="button" class="seg-btn" data-start="instant"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg><span data-i18n>เริ่มทันที</span></button>
            <button type="button" class="seg-btn" data-start="accurate"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span data-i18n>แม่นยำ</span></button>
          </div>
          <small class="field-hint" id="startHint"></small>
        </div>
        <div class="field"><div class="field-head"><label for="dubbingVolume" data-i18n>ความดังเสียงพากย์</label><output id="dubbingValue" for="dubbingVolume">100%</output></div><input type="range" id="dubbingVolume" min="0" max="1" step="0.05" value="1" /></div>
        <div class="field"><div class="field-head"><label for="originalAudioVolume" data-i18n>ความดังเสียงผู้สอน</label><output id="originalAudioValue" for="originalAudioVolume">15%</output></div><input type="range" id="originalAudioVolume" min="0" max="1" step="0.05" value="0.15" /></div>
      </section>

      <div class="actions">
        <button id="section" class="btn btn-primary"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-i18n>แปลทั้ง Section นี้ล่วงหน้า</span></button>
        <button id="retry" class="btn"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg><span data-i18n>แปลบทเรียนนี้ใหม่</span></button>
      </div>

      <div class="queue" id="queue" style="display: none" aria-live="polite">
        <div class="queue-title" id="queueTitle"></div>
        <div class="queue-detail" id="queueDetail"></div>
        <div class="queue-track"><div class="queue-fill" id="queueFill"></div></div>
      </div>

      <p class="hint" id="hint" data-i18n-html>ต้องเปิด <code>start-server.cmd</code> ค้างไว้ระหว่างเรียน</p>
    </main>

    <script src="core/i18n.js"></script>
    <script src="core/settings.js"></script>
    <script src="core/api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
