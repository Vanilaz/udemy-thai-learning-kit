<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1c20;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #5b3fd6;
        /* Text sitting on the accent. Dark mode lightens the accent, so white
           lettering drops to about 2.7:1 there — under the 4.5:1 minimum. The
           readable colour flips with the theme, so it needs its own token. */
        --on-accent: #ffffff;
        --ok-bg: #e8f7ee;
        --ok-fg: #1a7f45;
        --err-bg: #fdecec;
        --err-fg: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181c;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --line: #2c2f36;
          --accent: #a48bff;
          --on-accent: #1a1c20;
          --ok-bg: #14311f;
          --ok-fg: #7fe0a5;
          --err-bg: #3a1414;
          --err-fg: #ffb4ae;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 290px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      h1 { margin: 0 0 10px; font-size: 14px; font-weight: 650; }
      .status {
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--err-bg);
        color: var(--err-fg);
        font-weight: 550;
        margin-bottom: 12px;
      }
      .status.ok { background: var(--ok-bg); color: var(--ok-fg); }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 0;
        border-top: 1px solid var(--line);
      }
      label { cursor: pointer; }
      .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      /* A disabled control must read as disabled and stop responding, not just
         look slightly faded. */
      button:disabled { opacity: 0.45; cursor: default; }
      /* Secondary action: same size and hit area, lower visual weight, so the
         primary button stays the obvious one. */
      button.secondary {
        margin-top: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
      }
      button.secondary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--fg) 8%, transparent);
        filter: none;
      }
      .queue {
        margin-top: 12px;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      .queue-title { font-weight: 600; }
      .queue-detail {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .queue-track {
        margin-top: 8px;
        height: 4px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .queue-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--accent);
        transition: width 220ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .queue-fill { transition: none; }
      }
      code {
        font-family: Consolas, monospace;
        background: var(--line);
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>Udemy ซับไทย</h1>
    <div id="status" class="status">กำลังตรวจสอบ ...</div>

    <div class="row">
      <label for="enabled">แสดงซับไทย</label>
      <input type="checkbox" id="enabled" checked />
    </div>
    <div class="row">
      <label for="dual">แสดงอังกฤษด้วย</label>
      <input type="checkbox" id="dual" checked />
    </div>

    <button id="section">แปลทั้ง Section นี้ล่วงหน้า</button>
    <button id="retry" class="secondary">แปลบทเรียนนี้ใหม่</button>

    <div class="queue" id="queue" style="display: none" aria-live="polite">
      <div class="queue-title" id="queueTitle"></div>
      <div class="queue-detail" id="queueDetail"></div>
      <div class="queue-track"><div class="queue-fill" id="queueFill"></div></div>
    </div>

    <p class="hint" id="hint">
      ต้องเปิด <code>start-server.cmd</code> ค้างไว้ระหว่างเรียน
    </p>

    <script src="popup.js"></script>
  </body>
</html>
